name: android-emulator

# Builds the debug APK, then runs it in a real Android emulator and checks that the app schedules
# reminders and that a test notification rings. By hand only. It proves the app's logic and the
# scheduling path, not battery-saver behaviour of specific phone makers. See docs/ANDROID.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build the web app (static single-page build)
        env:
          GH_PAGES: '1'
          VITE_BUILD_SHA: ${{ github.sha }}
        run: bun run build
      - name: Prepare the folder Capacitor bundles
        run: node scripts/prepare-native-web.mjs
      - name: Generate the Android project
        run: npx cap add android
      - name: Ada icons
        run: |
          res=android/app/src/main/res
          find "$res" -name 'ic_launcher*' -delete
          rm -f "$res/drawable/ic_launcher_background.xml" "$res/drawable-v24/ic_launcher_foreground.xml"
          cp -r tools/android/res/. "$res/"
      - name: Reminder permissions
        run: python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
      - name: Copy the web app into it
        run: npx cap sync android
      - name: Use the fixed debug key
        run: mkdir -p ~/.android && cp tools/android/debug.keystore ~/.android/debug.keystore
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/android/emulator_test.sh android/app/build/outputs/apk/debug/app-debug.apk emulator-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-out-${{ matrix.api }}
          path: emulator-out
