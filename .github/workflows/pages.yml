name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: GH_PAGES=1 bun run build
      - name: Validate published PWA files
        run: |
          set -eu
          OUT=.output/public
          test -s "$OUT/_shell.html"
          test -s "$OUT/sw.js"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from "node:fs";

          const dir = ".output/public";
          const sw = readFileSync(`${dir}/sw.js`, "utf8");
          const shell = readFileSync(`${dir}/_shell.html`, "utf8");
          const manifest = JSON.parse(readFileSync(`${dir}/manifest.webmanifest`, "utf8"));
          const workboxFiles = readdirSync(dir).filter(
            (name) => name.startsWith("workbox-") && name.endsWith(".js"),
          );
          const precachesAssets = sw.includes("precacheAndRoute") && sw.includes("assets/");
          const precachesAppShell = sw.includes("_shell.html");
          const shellUsesRootAssets =
            shell.includes('src="/assets/') || shell.includes('href="/assets/');
          const hasRootManifest = manifest.start_url === "/" && manifest.scope === "/";
          const hasMatchedThemeColor = manifest.theme_color === manifest.background_color;
          const requiredIcons = [
            ["icon-192.png", "192x192", "any"],
            ["icon-512.png", "512x512", "any"],
            ["icon-maskable-192.png", "192x192", "maskable"],
            ["icon-maskable-512.png", "512x512", "maskable"],
          ];
          const hasRequiredIcons = requiredIcons.every(([src, sizes, purpose]) =>
            manifest.icons.some(
              (icon) =>
                icon.src === src &&
                icon.sizes === sizes &&
                icon.type === "image/png" &&
                icon.purpose === purpose &&
                existsSync(`${dir}/${src}`),
            ),
          );
          const hasAppleIcon = existsSync(`${dir}/apple-touch-icon.png`);
          const hasFavicons =
            existsSync(`${dir}/favicon.svg`) && existsSync(`${dir}/favicon.ico`);

          if (!workboxFiles.length) {
            throw new Error("PWA build failed: Workbox runtime is missing from .output/public");
          }
          if (!precachesAssets) {
            throw new Error("PWA build failed: service worker has no precached application assets");
          }
          if (!precachesAppShell) {
            throw new Error("PWA build failed: offline app shell is missing from the precache manifest");
          }
          if (!shellUsesRootAssets) {
            throw new Error("Static shell does not reference assets from the custom-domain root");
          }
          if (
            !hasRootManifest ||
            !hasRequiredIcons ||
            !hasAppleIcon ||
            !hasFavicons ||
            !hasMatchedThemeColor
          ) {
            throw new Error(
              "PWA output must include root-scoped manifest, any/maskable PNG icons, Apple touch icon, SVG/ICO favicons, and matching theme colors",
            );
          }

          console.log(
            `PWA output verified: sw.js, ${workboxFiles.length} Workbox file(s), app shell, and complete icon set.`,
          );
          NODE
      # GitHub Pages serves this app from the custom domain root; 404.html enables deep links.
      - name: Prepare static SPA
        run: |
          set -eu
          OUT=.output/public
          cp "$OUT/_shell.html" "$OUT/index.html"
          cp "$OUT/_shell.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          rm -rf site
          cp -r "$OUT" site
          test -s site/index.html
          test -s site/404.html
          test -s site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the deployed site
        env:
          PAGES_URL: https://ada.nawy.app/
        run: node scripts/smoke-pages.mjs
