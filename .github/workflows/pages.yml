name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      # ada.nawy.app is a custom domain, so assets must resolve from the origin root.
      - run: GH_PAGES=1 GH_PAGES_BASE=/ bun run build
      # Static SPA shell: index.html for the root, 404.html so deep links (/nawy-habit/settings) load the app.
      # Outside Lovable the build writes to .output/public; inside it uses dist/client.
      - run: |
          OUT=.output/public
          [ -f "$OUT/_shell.html" ] || OUT=dist/client
          cp "$OUT/_shell.html" "$OUT/index.html"
          cp "$OUT/_shell.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          rm -rf site && cp -r "$OUT" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
